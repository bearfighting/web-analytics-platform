services:
  router-playground:
    build:
      context: .
      dockerfile: docker/nextjs-router-playground.Dockerfile
    environment:
      NEXT_PUBLIC_ANALYTICS_TRANSPORT: ${NEXT_PUBLIC_ANALYTICS_TRANSPORT:-mock}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${NEXT_PUBLIC_ANALYTICS_INGEST_KEY:-}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-site_playground}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - playground_node_modules:/workspace/examples/nextjs-router-playground/node_modules
      - playground_next:/workspace/examples/nextjs-router-playground/.next

  collector:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    environment:
      RUST_LOG: collector=info
      COLLECTOR_CONFIG: ${COLLECTOR_CONFIG:-/workspace/protocol/http/config/collector.example.toml}
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
    ports:
      - "4001:4001"
    volumes:
      - .:/workspace
      - collector_target:/workspace/target

  postgres:
    profiles: ["storage"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  collector-migrate:
    profiles: ["storage"]
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      RUST_LOG: collector=info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - collector_target:/workspace/target
    command: ["cargo", "run", "-p", "collector", "--", "migrate"]

  processor:
    profiles: ["processing"]
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      PROCESSOR_POLL_INTERVAL_MS: ${PROCESSOR_POLL_INTERVAL_MS:-1000}
      RUST_LOG: processor=info
    depends_on:
      postgres:
        condition: service_healthy
      collector-migrate:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - processor_target:/workspace/target

  analytics-api:
    profiles: ["processing"]
    build:
      context: .
      dockerfile: docker/analytics-api.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      RUST_LOG: analytics_api=info
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      collector-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4002/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - .:/workspace
      - analytics_api_target:/workspace/target

  dashboard:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      ANALYTICS_API_URL: ${DASHBOARD_ANALYTICS_API_URL:-http://analytics-api:4002}
      DASHBOARD_SITES: ${DASHBOARD_SITES:-site_playground,site_alpha,site_beta}
      DASHBOARD_DEFAULT_SITE: ${DASHBOARD_DEFAULT_SITE:-site_playground}
    ports:
      - "${DASHBOARD_PORT:-13000}:3000"
    depends_on:
      analytics-api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/dashboard >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
      - dashboard_next:/workspace/apps/dashboard/.next

volumes:
  root_node_modules:
  playground_node_modules:
  playground_next:
  collector_target:
  postgres_data:
  processor_target:
  analytics_api_target:
  dashboard_node_modules:
  dashboard_next:
