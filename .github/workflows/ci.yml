name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust build
        run: cargo build --workspace

      - name: Validate complete Compose configuration
        run: >-
          docker compose
          -f compose.yaml
          -f compose.backend.yaml
          --profile backend
          --profile storage
          --profile processing
          --profile dashboard
          config --quiet

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run migration regression
        run: pnpm test:migrations

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Capture integration diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/integration
          postgres_container="$(docker ps -aq --filter name=postgres | head -n 1)"
          if [ -n "$postgres_container" ]; then
            docker logs "$postgres_container" > artifacts/integration/postgres.log 2>&1 || true
            docker inspect "$postgres_container" > artifacts/integration/postgres-inspect.json 2>&1 || true
          else
            printf '%s\n' "PostgreSQL service container was not found." > artifacts/integration/postgres.log
          fi
          docker ps -a > artifacts/integration/docker-ps.txt 2>&1 || true

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: artifacts/integration
          if-no-files-found: ignore

  analytics-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Analytics E2E
        run: pnpm e2e:analytics

      - name: Upload Analytics E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-e2e-artifacts
          path: artifacts/analytics-e2e
          if-no-files-found: ignore

  dashboard-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Dashboard E2E
        run: pnpm e2e:dashboard

      - name: Upload Dashboard E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-artifacts
          path: artifacts/dashboard-e2e
          if-no-files-found: ignore

  router-adapters-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Run Router Adapter E2E
        run: pnpm e2e:router-adapters
